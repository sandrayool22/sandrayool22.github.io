<!DOCTYPE html>
<html lang="es">
<head>

<title>Seguimiento de Solicitudes</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

    font-family:'Segoe UI',sans-serif;
}

.container-box{
    margin-top:40px;
}

.card{

    border-radius:20px;

.card-header{

.btn-view{

}

.btn-view:hover{

    color:white;
}

</head>

                    <th>Estado</th>
