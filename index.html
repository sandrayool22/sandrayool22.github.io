<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Samboro</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    margin:0;
    font-family:'Segoe UI', sans-serif;
    background:#EFEAE4;
    overflow:hidden;
}

/* CONTENEDOR PRINCIPAL */
.hero{
    min-height:100vh;
    display:grid;
    grid-template-columns: 1fr 1fr;
}

/* PANEL IZQUIERDO */
.left{
    padding:70px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    background:#E8E0D6;
}

/* PANEL DERECHO / IMAGEN */
.right{
    display:block;
    text-decoration:none;

    background:
    linear-gradient(rgba(0,0,0,0.15),rgba(0,0,0,0.25)),
    url("https://images.unsplash.com/photo-1600585154340-be6161a56a0c");

    background-size:cover;
    background-position:center;

    transition:0.4s;
}

.right:hover{
    transform:scale(1.01);
}

/* LOGO */
.logo{
    font-size:28px;
    font-weight:700;
    color:#B5121B;
    margin-bottom:80px;
    letter-spacing:2px;
}

/* TITULO */
h1{
    font-size:72px;
    line-height:1.05;
    font-weight:300;
    margin-bottom:30px;
    color:#2B2B2B;
}

h1 span{
    color:#B5121B;
    font-weight:600;
}

/* TEXTO */
p{
    font-size:18px;
    max-width:520px;
    color:#555;
    margin-bottom:35px;
}

/* BOTON */
.btn-main{
    background:#B5121B;
    color:white;
    border:none;
    padding:14px 32px;
    border-radius:30px;
    text-decoration:none;
    width:fit-content;
    transition:0.3s;
}

.btn-main:hover{
    background:#8F0E15;
    color:white;
}

/* KPIs */
.info-box{
    margin-top:70px;
    display:flex;
    gap:25px;
}

.info{
    border-left:4px solid #B5121B;
    padding-left:15px;
}

.info h4{
    font-size:24px;
    margin:0;
    color:#2B2B2B;
}

.info small{
    color:#666;
}

/* RESPONSIVE */
@media(max-width:900px){

    .hero{
        grid-template-columns:1fr;
    }

    .right{
        min-height:350px;
    }

    h1{
        font-size:48px;
    }

    .left{
        padding:40px;
    }

    body{
        overflow:auto;
    }
}

</style>
</head>

<body>

<section class="hero">

    <!-- PANEL IZQUIERDO -->
    <div class="left">

        <div class="logo">
            SAMBORO
        </div>

        <h1>
            Gestión inteligente<br>
            de <span>proyectos</span>
        </h1>

        <p>
            Plataforma web diseñada para optimizar el control,
            seguimiento y priorización de solicitudes operativas
            dentro de Samboro.
        </p>

        <!-- BOTON LOGIN -->
        <a href="login.html" class="btn-main">
            Ingresar al sistema
        </a>

        <!-- KPIs -->
        <div class="info-box">

            <div class="info">
                <h4>25</h4>
                <small>Solicitudes registradas</small>
            </div>

            <div class="info">
                <h4>92%</h4>
                <small>Precisión IA</small>
            </div>

            <div class="info">
                <h4>35%</h4>
                <small>Reducción esperada</small>
            </div>

        </div>

    </div>

    <!-- IMAGEN QUE REDIRIGE -->
    <a href="login.html" class="right"></a>

</section>

</body>
</html>
