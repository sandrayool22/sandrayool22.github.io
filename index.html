<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Inicio de Sesión</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background: linear-gradient(135deg,#B5121B,#8F0E15);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Segoe UI',sans-serif;
}

.login-card{
    width:380px;
    background:white;
    border-radius:20px;
    padding:40px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.logo{
    width:90px;
    margin:auto;
    display:block;
    margin-bottom:20px;
}

.btn-login{
    background:#B5121B;
    border:none;
    border-radius:10px;
    padding:12px;
}

.btn-login:hover{
    background:#8F0E15;
}

.form-control{
    border-radius:10px;
}
</style>
</head>

<body>

<div class="login-card">

    <h3 class="text-center mb-4">Sistema Samboro</h3>

    <label class="form-label">Usuario</label>
    <input type="text" class="form-control mb-3">

    <label class="form-label">Contraseña</label>
    <input type="password" class="form-control mb-4">

    <a href="dashboard.html" class="btn btn-login text-white w-100">
        Ingresar
    </a>

</div>

</body>
</html>
