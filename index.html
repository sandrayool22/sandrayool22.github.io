<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sistema Samboro</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Segoe UI', sans-serif;
    background:#EFEAE4;
    color:#2B2B2B;
}

.hero{
    min-height:100vh;
    display:grid;
    grid-template-columns: 1fr 1fr;
}

.left{
    padding:70px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    background:#E8E0D6;
}

.right{
    background:
    linear-gradient(rgba(0,0,0,0.15),rgba(0,0,0,0.25)),
    url("https://images.unsplash.com/photo-1600585154340-be6161a56a0c");
    background-size:cover;
    background-position:center;
}

.logo{
    font-size:28px;
    font-weight:700;
    color:#B5121B;
    margin-bottom:80px;
}

h1{
    font-size:72px;
    line-height:1.05;
    font-weight:300;
    margin-bottom:30px;
}

h1 span{
    color:#B5121B;
    font-weight:600;
}

p{
    font-size:18px;
    max-width:520px;
    color:#555;
    margin-bottom:35px;
}

.btn-main{
    background:#B5121B;
    color:white;
    border:none;
    padding:14px 32px;
    border-radius:30px;
    text-decoration:none;
    width:fit-content;
}

.btn-main:hover{
    background:#8F0E15;
    color:white;
}

.info-box{
    margin-top:70px;
    display:flex;
    gap:25px;
}

.info{
    border-left:4px solid #B5121B;
    padding-left:15px;
}

.info h4{
    font-size:24px;
    margin:0;
}

.info small{
    color:#666;
}

@media(max-width:900px){
    .hero{
        grid-template-columns:1fr;
    }

    .right{
        min-height:350px;
    }

    h1{
        font-size:48px;
    }

    .left{
        padding:40px;
    }
}
</style>
</head>

<body>

<section class="hero">

    <div class="left">
        <div class="logo">SAMBORO</div>

        <h1>
            Gestión inteligente<br>
            de <span>solicitudes</span>
        </h1>

        <p>
            Plataforma web para centralizar, priorizar y dar seguimiento a solicitudes operativas
            de mantenimiento, informática y arquitectura dentro de Samboro.
        </p>

        <a href="login.html" class="btn-main">
            Ingresar al sistema
        </a>

        <div class="info-box">
            <div class="info">
                <h4>25</h4>
                <small>Solicitudes registradas</small>
            </div>

            <div class="info">
                <h4>92%</h4>
                <small>Clasificación con IA</small>
            </div>

            <div class="info">
                <h4>35%</h4>
                <small>Reducción esperada</small>
            </div>
        </div>
    </div>

    <div class="right"></div>

</section>

</body>
</html>
