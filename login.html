<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Login - Samboro</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI', sans-serif;
    overflow:hidden;
}

.container-login{
    width:100%;
    height:100vh;
    position:relative;
}

/* Imagen de fondo */
.background{
    width:100%;
    height:100%;
    background:
    linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
    url("https://images.unsplash.com/photo-1618221195710-dd6b41faaea6");
    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Caja login */
.login-card{
    width:420px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,0.2);
    border-radius:24px;
    padding:45px;
    color:white;
    box-shadow:0 10px 30px rgba(0,0,0,0.25);
}

/* Logo */
.logo{
    text-align:center;
    margin-bottom:35px;
}

.logo h1{
    font-size:38px;
    font-weight:700;
    letter-spacing:2px;
    color:white;
}

.logo span{
    color:#D72638;
}

/* Inputs */
.form-control{
    height:52px;
    border:none;
    border-radius:14px;
    background:rgba(255,255,255,0.9);
}

.form-control:focus{
    box-shadow:none;
    border:2px solid #B5121B;
}

/* Botón */
.btn-login{
    width:100%;
    height:52px;
    background:#B5121B;
    border:none;
    border-radius:14px;
    color:white;
    font-weight:600;
    transition:0.3s;
}

.btn-login:hover{
    background:#8F0E15;
}

/* Texto */
.subtitle{
    text-align:center;
    color:rgba(255,255,255,0.85);
    margin-bottom:30px;
}

.footer-text{
    text-align:center;
    margin-top:25px;
    font-size:14px;
    color:rgba(255,255,255,0.7);
}

@media(max-width:500px){

    .login-card{
        width:90%;
        padding:35px;
    }

    .logo h1{
        font-size:30px;
    }

}

</style>
</head>

<body>

<div class="container-login">

    <div class="background">

        <div class="login-card">

            <div class="logo">
                <h1>SAM<span>BORO</span></h1>
            </div>

            <p class="subtitle">
                Sistema de Gestión Operativa
            </p>

            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" class="form-control" placeholder="Ingrese su usuario">
            </div>

            <div class="mb-4">
                <label class="form-label">Contraseña</label>
                <input type="password" class="form-control" placeholder="Ingrese su contraseña">
            </div>

            <a href="dashboard.html" class="btn btn-login">
                Ingresar al sistema
            </a>

            <div class="footer-text">
                Samboro © 2026
            </div>

        </div>

    </div>

</div>

</body>
</html>
