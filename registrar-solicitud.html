<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registrar Solicitud</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#F5F5F5;
    font-family:'Segoe UI',sans-serif;
}

.container-box{
    max-width:850px;
    margin:auto;
    margin-top:50px;
}

.card{
    border:none;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,0.05);
}

.card-header{
    background:#B5121B;
    color:white;
    border-radius:20px 20px 0 0 !important;
    padding:20px;
}

.form-control,
.form-select{
    border-radius:10px;
}

.btn-save{
    background:#B5121B;
    color:white;
    border:none;
    border-radius:10px;
}

.btn-save:hover{
    background:#8F0E15;
    color:white;
}
</style>
</head>

<body>

<div class="container-box">

<div class="card">
    <div class="card-header">
        <h4>Registrar Solicitud</h4>
    </div>

    <div class="card-body p-4">

        <label class="form-label">Título</label>
        <input type="text" class="form-control mb-3" placeholder="Ej. Falla en red">

        <label class="form-label">Categoría</label>
        <select class="form-select mb-3">
            <option>Informática</option>
            <option>Mantenimiento</option>
            <option>Arquitectura</option>
        </select>

        <label class="form-label">Prioridad</label>
        <select class="form-select mb-3">
            <option>Alta</option>
            <option>Media</option>
            <option>Baja</option>
        </select>

        <label class="form-label">Descripción</label>
        <textarea class="form-control mb-3" rows="5" placeholder="Describa la solicitud"></textarea>

        <label class="form-label">Adjuntar Evidencia</label>
        <input type="file" class="form-control mb-4">

        <button class="btn btn-save px-4">
            Enviar Solicitud
        </button>

        <a href="dashboard.html" class="btn btn-outline-secondary ms-2">
            Regresar
        </a>

    </div>
</div>

</div>

</body>
</html>
