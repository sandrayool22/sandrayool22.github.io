<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sistema Samboro</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    margin:0;
    font-family:'Segoe UI', sans-serif;
    overflow:hidden;
    background:#EFEAE4;
}

/* CONTENEDOR PRINCIPAL */
.hero{
    min-height:100vh;
    display:grid;
    grid-template-columns:1fr 1fr;
}

/* PANEL IZQUIERDO */
.left{
    padding:70px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    background:#E8E0D6;
}

/* LOGO */
.logo{
    font-size:28px;
    font-weight:700;
    color:#B5121B;
    margin-bottom:80px;
    letter-spacing:2px;
}

/* TITULO */
h1{
    font-size:70px;
    line-height:1.05;
    font-weight:300;
    margin-bottom:30px;
    color:#2B2B2B;
}

h1 span{
    color:#B5121B;
    font-weight:600;
}

/* TEXTO */
p{
    font-size:18px;
    max-width:520px;
    color:#555;
    margin-bottom:35px;
}

/* BOTON PRINCIPAL */
.btn-main{
    background:#B5121B;
    color:white;
    border:none;
    padding:14px 32px;
    border-radius:30px;
    text-decoration:none;
    width:fit-content;
    cursor:pointer;
    transition:0.3s;
}

.btn-main:hover{
    background:#8F0E15;
}

/* KPIS */
.info-box{
    margin-top:70px;
    display:flex;
    gap:25px;
}

.info{
    border-left:4px solid #B5121B;
    padding-left:15px;
}

.info h4{
    font-size:24px;
    margin:0;
    color:#2B2B2B;
}

.info small{
    color:#666;
}

/* PANEL DERECHO */
.right{
    position:relative;
    overflow:hidden;
}

/* IMAGEN */
.image-side{
    position:absolute;
    width:100%;
    height:100%;

    background:
    linear-gradient(rgba(0,0,0,0.15),rgba(0,0,0,0.25)),
    url("https://images.unsplash.com/photo-1600585154340-be6161a56a0c");

    background-size:cover;
    background-position:center;
}

/* LOGIN */
.login-side{
    position:absolute;
    width:100%;
    height:100%;

    background:
    linear-gradient(rgba(0,0,0,0.55),rgba(0,0,0,0.55)),
    url("https://images.unsplash.com/photo-1600585154340-be6161a56a0c");

    background-size:cover;
    background-position:center;

    display:flex;
    justify-content:center;
    align-items:center;

    opacity:0;
    visibility:hidden;

    transition:0.8s;
}

/* LOGIN ACTIVO */
.login-side.active{
    opacity:1;
    visibility:visible;
}

/* CARD LOGIN */
.login-card{
    width:420px;

    background:rgba(255,255,255,0.12);

    backdrop-filter:blur(14px);

    border:1px solid rgba(255,255,255,0.2);

    border-radius:24px;

    padding:45px;

    color:white;

    box-shadow:0 10px 30px rgba(0,0,0,0.25);
}

.login-card h2{
    text-align:center;
    margin-bottom:10px;
}

.login-card p{
    text-align:center;
    color:rgba(255,255,255,0.75);
    margin-bottom:30px;
}

/* INPUTS */
.form-control{
    height:52px;
    border:none;
    border-radius:12px;
}

/* BOTON LOGIN */
.btn-login{
    width:100%;
    height:52px;

    background:#B5121B;

    border:none;

    border-radius:12px;

    color:white;

    font-weight:600;

    transition:0.3s;
}

.btn-login:hover{
    background:#8F0E15;
}

/* RESPONSIVE */
@media(max-width:900px){

    .hero{
        grid-template-columns:1fr;
    }

    .right{
        min-height:500px;
    }

    h1{
        font-size:50px;
    }

    .left{
        padding:40px;
    }

    body{
        overflow:auto;
    }

}

</style>
</head>

<body>

<section class="hero">

    <!-- PANEL IZQUIERDO -->
    <div class="left">

        <div class="logo">
            SAMBORO
        </div>

        <h1>
            Gestión inteligente<br>
            de <span>proyectos</span>
        </h1>

        <p>
            Plataforma web diseñada para optimizar el control,
            seguimiento y priorización de solicitudes operativas
            dentro de Samboro.
        </p>

        <!-- BOTON -->
        <button class="btn-main" onclick="mostrarLogin()">
            Ingresar al sistema
        </button>

        <!-- KPIS -->
        <div class="info-box">

            <div class="info">
                <h4>25</h4>
                <small>Solicitudes registradas</small>
            </div>

            <div class="info">
                <h4>92%</h4>
                <small>Precisión IA</small>
            </div>

            <div class="info">
                <h4>35%</h4>
                <small>Reducción esperada</small>
            </div>

        </div>

    </div>

    <!-- PANEL DERECHO -->
    <div class="right">

        <!-- IMAGEN -->
        <div class="image-side"></div>

        <!-- LOGIN -->
        <div class="login-side" id="loginSide">

            <div class="login-card">

                <h2>Bienvenido</h2>

                <p>
                    Ingrese sus credenciales
                </p>

                <div class="mb-3">

                    <label>Usuario</label>

                    <input type="text" class="form-control">

                </div>

                <div class="mb-4">

                    <label>Contraseña</label>

                    <input type="password" class="form-control">

                </div>

                <!-- BOTON LOGIN -->
                <button class="btn btn-login" onclick="ingresarSistema()">

                    Ingresar

                </button>

            </div>

        </div>

    </div>

</section>

<script>

/* MOSTRAR LOGIN */

function mostrarLogin(){

    document
    .getElementById("loginSide")
    .classList.add("active");

}

/* REDIRECCIONAR AL DASHBOARD */

function ingresarSistema(){

    window.location.href = "dashboard.html";

}

</script>

</body>
</html>
