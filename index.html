<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inventra</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Poppins',sans-serif;
            background:#0f172a;
            color:white;
            min-height:100vh;
            overflow-x:hidden;
            position:relative;
        }

        .background-glow{
            position:absolute;
            width:500px;
            height:500px;
            background:#2563eb;
            filter:blur(180px);
            opacity:0.25;
            top:-150px;
            right:-100px;
            z-index:0;
        }

        header{
            width:100%;
            padding:25px 80px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            position:relative;
            z-index:2;
        }

        .logo-section h1{
            font-size:32px;
            letter-spacing:3px;
            color:#60a5fa;
        }

        .logo-section span{
            color:#94a3b8;
            font-size:14px;
        }

        nav{
            display:flex;
            gap:30px;
        }

        nav a{
            color:white;
            text-decoration:none;
            font-weight:500;
            transition:0.3s;
        }

        nav a:hover{
            color:#60a5fa;
        }

        main{
            width:100%;
            min-height:85vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:40px 80px;
            position:relative;
            z-index:2;
        }

        .hero{
            width:100%;
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:50px;
        }

        .hero-text{
            max-width:600px;
        }

        .hero-text h2{
            font-size:64px;
            line-height:1.1;
            margin-bottom:25px;
        }

        .hero-text p{
            color:#cbd5e1;
            font-size:18px;
            margin-bottom:35px;
            line-height:1.7;
        }

        .btn-primary{
            display:inline-block;
            padding:15px 35px;
            background:#2563eb;
            border-radius:12px;
            color:white;
            text-decoration:none;
            font-weight:600;
            transition:0.3s;
            border:none;
            cursor:pointer;
        }

        .btn-primary:hover{
            transform:translateY(-3px);
            background:#3b82f6;
        }

        .hero-card{
            width:420px;
            background:rgba(255,255,255,0.05);
            border:1px solid rgba(255,255,255,0.08);
            backdrop-filter:blur(15px);
            border-radius:25px;
            padding:35px;
            position:relative;
            overflow:hidden;
        }

        .card-glow{
            position:absolute;
            width:250px;
            height:250px;
            background:#3b82f6;
            filter:blur(100px);
            opacity:0.25;
            top:-80px;
            right:-80px;
        }

        .hero-card h3{
            margin-bottom:30px;
            font-size:24px;
        }

        .status-box{
            background:rgba(255,255,255,0.05);
            border-radius:15px;
            padding:18px;
            margin-bottom:18px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .status-box span{
            color:#cbd5e1;
        }

        .status-box strong{
            font-size:20px;
        }

        .online{
            color:#22c55e;
        }

        .crud-section{
            margin-top:25px;
        }

        .crud-section input{
            width:100%;
            padding:14px;
            margin-bottom:15px;
            border:none;
            border-radius:10px;
            background:#1e293b;
            color:white;
            outline:none;
        }

        table{
            width:100%;
            margin-top:20px;
            border-collapse:collapse;
        }

        table th{
            background:#1e293b;
            padding:12px;
        }

        table td{
            background:rgba(255,255,255,0.03);
            padding:12px;
            text-align:center;
        }

        .delete-btn{
            background:#dc2626;
            padding:8px 15px;
            border:none;
            border-radius:8px;
            color:white;
            cursor:pointer;
        }

        @media(max-width:950px){

            .hero{
                flex-direction:column;
                text-align:center;
            }

            header{
                flex-direction:column;
                gap:20px;
                padding:25px;
            }

            main{
                padding:25px;
            }

            .hero-text h2{
                font-size:42px;
            }

            .hero-card{
                width:100%;
            }

        }

    </style>

</head>

<body>

    <div class="background-glow"></div>

    <header>

        <div class="logo-section">
            <h1>INVENTRA</h1>
            <span>Smart Inventory System</span>
        </div>

        <nav>
            <a href="#">Dashboard</a>
            <a href="#">Productos</a>
            <a href="#">Pedidos</a>
        </nav>

    </header>

    <main>

        <section class="hero">

            <div class="hero-text">

                <h2>
                    Control inteligente <br>
                    para tu inventario
                </h2>

                <p>
                    Gestiona productos, pedidos y estadísticas
                    desde una plataforma moderna y centralizada.
                </p>

            </div>

            <div class="hero-card">

                <div class="card-glow"></div>

                <h3>Registro de Productos</h3>

                <div class="status-box">
                    <span>Estado del sistema</span>
                    <strong class="online">ONLINE</strong>
                </div>

                <div class="crud-section">

                    <input type="text" id="nombre" placeholder="Nombre del producto">

                    <input type="number" id="precio" placeholder="Precio">

                    <input type="number" id="stock" placeholder="Stock">

                    <button class="btn-primary" onclick="agregarProducto()">
                        Guardar Producto
                    </button>

                    <table>

                        <thead>
                            <tr>
                                <th>Producto</th>
                                <th>Precio</th>
                                <th>Stock</th>
                                <th>Acción</th>
                            </tr>
                        </thead>

                        <tbody id="tablaProductos"></tbody>

                    </table>

                </div>

            </div>

        </section>

    </main>

    <script>

        let productos = JSON.parse(localStorage.getItem("productos")) || [];

        function guardarLocal(){

            localStorage.setItem(
                "productos",
                JSON.stringify(productos)
            );

        }

        function agregarProducto(){

            const nombre = document.getElementById("nombre").value;
            const precio = document.getElementById("precio").value;
            const stock = document.getElementById("stock").value;

            if(nombre === "" || precio === "" || stock === ""){

                alert("Completa todos los campos");
                return;

            }

            const producto = {

                id: Date.now(),
                nombre: nombre,
                precio: precio,
                stock: stock

            };

            productos.push(producto);

            guardarLocal();

            mostrarProductos();

            limpiarCampos();

        }

        function mostrarProductos(){

            const tabla = document.getElementById("tablaProductos");

            tabla.innerHTML = "";

            productos.forEach(producto => {

                tabla.innerHTML += `

                    <tr>

                        <td>${producto.nombre}</td>

                        <td>Q${producto.precio}</td>

                        <td>${producto.stock}</td>

                        <td>
                            <button 
                                class="delete-btn"
                                onclick="eliminarProducto(${producto.id})"
                            >
                                Eliminar
                            </button>
                        </td>

                    </tr>

                `;

            });

        }

        function eliminarProducto(id){

            productos = productos.filter(
                producto => producto.id !== id
            );

            guardarLocal();

            mostrarProductos();

        }

        function limpiarCampos(){

            document.getElementById("nombre").value = "";
            document.getElementById("precio").value = "";
            document.getElementById("stock").value = "";

        }

        mostrarProductos();

    </script>

</body>
</html>
