<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registrar Solicitud</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">
  <h3 class="mb-4">Registrar Solicitud</h3>

  <div class="card border-0 shadow-sm">
    <div class="card-body">
      <label class="form-label">Título</label>
      <input type="text" class="form-control mb-3" placeholder="Ej. Falla en equipo de red">

      <label class="form-label">Categoría</label>
      <select class="form-select mb-3">
        <option>Mantenimiento</option>
        <option>Informática</option>
        <option>Arquitectura</option>
      </select>

      <label class="form-label">Descripción</label>
      <textarea class="form-control mb-3" rows="4" placeholder="Describa la solicitud"></textarea>

      <label class="form-label">Evidencia</label>
      <input type="file" class="form-control mb-4">

      <a href="seguimiento-solicitudes.html" class="btn btn-dark">Enviar solicitud</a>
      <a href="dashboard.html" class="btn btn-outline-secondary">Cancelar</a>
    </div>
  </div>
</div>

</body>
</html>
